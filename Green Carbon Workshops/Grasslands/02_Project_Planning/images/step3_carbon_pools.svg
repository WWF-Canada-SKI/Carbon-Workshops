<title id="t">Carbon pools</title>
<desc id="d">A grassland cross-section with a tree, a shrub and ground vegetation inside a small quadrat, each with roots, and a soil core divided into depth increments from 0 to 100 centimetres. Rough stocks in kilograms of carbon per square metre: tree about 4.1, tree roots about 1.3, shrub and shrub roots no value yet, ground vegetation about 0.05 to 0.2, grass roots about 0.25 to 1.0, soil 0 to 30 centimetres about 8 to 11.</desc>
