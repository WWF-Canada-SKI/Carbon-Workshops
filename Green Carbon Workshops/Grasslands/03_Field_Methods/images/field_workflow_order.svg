<svg xmlns="http://www.w3.org/2000/svg" width="500" height="456" viewBox="0 0 500 456" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Where each step of the plot visit happens</title>
<desc id="d">A plot diagram with seven numbered stations arranged in the order they are worked, clockwise from marking and GPS at the top: laying out plots, photographing, recording site conditions, measuring trees and shrubs, then clipping the quadrat and taking an offset core. The first five are green, the last two orange. The crew approaches on a single path from outside. Sectioning and bagging happen off the plot.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b9b8b1"/></marker></defs>
<text x="20" y="26" font-size="13.5" fill="#898781" text-anchor="start" font-weight="600">Where each step happens on the plot</text>
<text x="20" y="44" font-size="11" fill="#a5a49e" text-anchor="start" font-weight="normal">Numbers match the sequence below.</text>
<circle cx="250" cy="226" r="140" fill="#199e70" opacity="0.07" stroke="#199e70" stroke-width="1.6" stroke-dasharray="6 5"/>
<circle cx="250" cy="226" r="4" fill="#898781"/>
<text x="250" y="245" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal">plot centre</text>
<path d="M24 372 Q 110 356 158 318" stroke="#a5a49e" stroke-width="1.6" fill="none" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="20" y="392" font-size="11" fill="#a5a49e" text-anchor="start" font-weight="normal">approach on one path — keep traffic off the plot</text>
<path d="M288 142 A 94 94 0 1 1 178 168" stroke="#a5a49e" stroke-width="1.2" fill="none" stroke-dasharray="3 5" opacity="0.8" marker-end="url(#ar)"/>
<circle cx="250" cy="120" r="15" fill="#199e70" opacity="0.18" stroke="#199e70" stroke-width="1.8"/>
<text x="250" y="125" font-size="13" fill="#199e70" text-anchor="middle" font-weight="600">1</text>
<text x="250" y="97" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal">mark + GPS</text>
<circle cx="350" cy="170" r="15" fill="#199e70" opacity="0.18" stroke="#199e70" stroke-width="1.8"/>
<text x="350" y="175" font-size="13" fill="#199e70" text-anchor="middle" font-weight="600">2</text>
<text x="350" y="202" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal">lay out plots</text>
<circle cx="368" cy="258" r="15" fill="#199e70" opacity="0.18" stroke="#199e70" stroke-width="1.8"/>
<text x="368" y="263" font-size="13" fill="#199e70" text-anchor="middle" font-weight="600">3</text>
<text x="368" y="290" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal">photograph</text>
<circle cx="312" cy="330" r="15" fill="#199e70" opacity="0.18" stroke="#199e70" stroke-width="1.8"/>
<text x="312" y="335" font-size="13" fill="#199e70" text-anchor="middle" font-weight="600">4</text>
<text x="312" y="362" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal">site + management</text>
<circle cx="182" cy="326" r="15" fill="#199e70" opacity="0.18" stroke="#199e70" stroke-width="1.8"/>
<text x="182" y="331" font-size="13" fill="#199e70" text-anchor="middle" font-weight="600">5</text>
<text x="182" y="358" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal">trees, shrubs</text>
<circle cx="134" cy="252" r="15" fill="#d95926" opacity="0.18" stroke="#d95926" stroke-width="1.8"/>
<text x="134" y="257" font-size="13" fill="#d95926" text-anchor="middle" font-weight="600">6</text>
<text x="134" y="284" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal">clip quadrat</text>
<circle cx="154" cy="162" r="15" fill="#d95926" opacity="0.18" stroke="#d95926" stroke-width="1.8"/>
<text x="154" y="167" font-size="13" fill="#d95926" text-anchor="middle" font-weight="600">7</text>
<text x="154" y="139" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal">core, offset</text>
<circle cx="26" cy="414" r="5.5" fill="#199e70" opacity="0.18" stroke="#199e70" stroke-width="1.6"/>
<text x="39" y="418" font-size="11" fill="#a5a49e" text-anchor="start" font-weight="normal">non-destructive (1–5)</text>
<circle cx="196" cy="414" r="5.5" fill="#d95926" opacity="0.18" stroke="#d95926" stroke-width="1.6"/>
<text x="209" y="418" font-size="11" fill="#a5a49e" text-anchor="start" font-weight="normal">destructive (6–7)</text>
<text x="20" y="442" font-size="10.5" fill="#a5a49e" text-anchor="start" font-weight="normal">Steps 8 and 9 — sectioning and bagging — happen off the plot.</text>
</svg>
