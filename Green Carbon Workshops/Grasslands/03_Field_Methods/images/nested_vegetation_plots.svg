<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Nested vegetation plots and height classes</title>
<desc id="d">A plan view of the large, medium and small plots nested around the plot centre with a soil core offset from the quadrat, beside an elevation showing the three height classes — trees over two metres, shrubs from half a metre to two metres, and ground vegetation below half a metre — with the plot area used for each.</desc>
<text x="24" y="28" font-size="14" fill="#898781" text-anchor="start" font-weight="600">The nested vegetation plots</text>
<text x="24" y="46" font-size="11.5" fill="#a5a49e" text-anchor="start" font-weight="normal">Each plot size holds one height class, and each pool is divided by ITS OWN area before the pools are combined.</text>
<circle cx="200" cy="206" r="110" fill="#199e70" opacity="0.07" stroke="#199e70" stroke-width="2"/>
<text x="200" y="86" font-size="11.5" fill="#199e70" text-anchor="middle" font-weight="600">trees</text>
<rect x="144" y="150" width="112" height="112" rx="3" fill="#3987e5" opacity="0.10" stroke="#3987e5" stroke-width="2"/>
<text x="152" y="164" font-size="11" fill="#3987e5" text-anchor="start" font-weight="600">shrubs</text>
<rect x="156" y="218" width="32" height="32" fill="#d95926" opacity="0.24" stroke="#d95926" stroke-width="2"/>
<text x="138" y="238" font-size="11" fill="#d95926" text-anchor="end" font-weight="600">ground</text>
<circle cx="244" cy="234" r="6" fill="#c98500"/>
<path d="M192 234 h42" stroke="#c98500" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="218" y="223" font-size="9.5" fill="#c98500" text-anchor="middle" font-weight="normal">offset</text>
<circle cx="200" cy="206" r="3.5" fill="#898781"/>
<text x="200" y="346" font-size="11" fill="#a5a49e" text-anchor="middle" font-weight="normal">The core is offset from the quadrat, and the offset is recorded.</text>
<line x1="384" y1="318" x2="724" y2="318" stroke="#b9b8b1" stroke-width="1.5"/>
<line x1="384" y1="212" x2="724" y2="212" stroke="#b9b8b1" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="388" y="205" font-size="12" fill="#199e70" font-weight="600" font-family="system-ui, sans-serif">trees &gt; 2 m</text>
<text x="720" y="205" font-size="11" fill="#a5a49e" text-anchor="end" font-weight="normal">400 m²</text>
<line x1="384" y1="258" x2="724" y2="258" stroke="#b9b8b1" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="388" y="251" font-size="12" fill="#3987e5" font-weight="600" font-family="system-ui, sans-serif">shrubs 0.5–2 m</text>
<text x="720" y="251" font-size="11" fill="#a5a49e" text-anchor="end" font-weight="normal">16–100 m²</text>
<line x1="384" y1="296" x2="724" y2="296" stroke="#b9b8b1" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="388" y="289" font-size="12" fill="#d95926" font-weight="600" font-family="system-ui, sans-serif">ground &lt; 0.5 m</text>
<text x="720" y="289" font-size="11" fill="#a5a49e" text-anchor="end" font-weight="normal">0.25 m²</text>
<text x="388" y="336" font-size="11" fill="#a5a49e" text-anchor="start" font-weight="normal">ground level — the datum for the clip height</text>
<text x="384" y="92" font-size="13" fill="#898781" text-anchor="start" font-weight="600">Measured in this order</text>
<text x="384" y="116" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">1.  trees — non-destructive</text>
<text x="384" y="138" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">2.  shrubs — non-destructive</text>
<text x="384" y="160" font-size="12" fill="#d95926" text-anchor="start" font-weight="600">3.  quadrat — destructive, last</text>
</svg>
