<text x="602.0" y="39.5" font-size="14.5" fill="#7a7a7a"><tspan font-weight="600">10.97</tspan></text>
<text x="136" y="91.5" font-size="14.5" text-anchor="end" fill="#7a7a7a">Roots</text>
<path d="M150.0 70.0 H178.3 A4.0 4.0 0 0 1 182.3 74.0 V98.0 A4.0 4.0 0 0 1 178.3 102.0 H150.0 Z" fill="#6E8B3D"/>
<text x="194.3" y="91.5" font-size="14.5" fill="#7a7a7a"><tspan font-weight="600">0.81</tspan></text>
<text x="136" y="143.5" font-size="14.5" text-anchor="end" fill="#7a7a7a">Shoots</text>
<path d="M150.0 122.0 H153.3 A3.3 3.3 0 0 1 156.6 125.3 V150.7 A3.3 3.3 0 0 1 153.3 154.0 H150.0 Z" fill="#6E8B3D"/>
<text x="168.6" y="143.5" font-size="14.5" fill="#7a7a7a"><tspan font-weight="600">0.17</tspan></text>
