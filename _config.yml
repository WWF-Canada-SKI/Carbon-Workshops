title: Blue Carbon Eelgrass Workshop
description: Field guides, worked examples and resources for measuring sediment carbon in eelgrass meadows
markdown: CommonMarkGhPages
plugins:
  - jekyll-commonmark-ghpages
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
defaults:
  - scope:
      path: ''
    values:
      layout: default
commonmark:
  options: [UNSAFE, SMART, FOOTNOTES]
  extensions: [strikethrough, autolink, table, tagfilter]
readme_index:
  enabled: true
  remove_originals: true
  with_frontmatter: true
relative_links:
  enabled: true
exclude:
  - PUBLISHING.md
  - 'Blue Carbon Workshops/01_Background/images/README.md'
  - 'Blue Carbon Workshops/01_Background/images/TODO.md'
  - 'Blue Carbon Workshops/02_Project_Planning/Sampling Design Tools'
